name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/OpsPulse.slnx

      - name: Build
        run: dotnet build backend/OpsPulse.slnx --no-restore -c Release

      - name: Test
        run: dotnet test backend/OpsPulse.slnx --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/opspulse-web/package-lock.json

      - name: Install
        working-directory: frontend/opspulse-web
        run: npm ci

      - name: Lint
        working-directory: frontend/opspulse-web
        run: npx oxlint src

      - name: Build
        working-directory: frontend/opspulse-web
        run: npm run build
